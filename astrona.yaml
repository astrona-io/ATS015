# Course manifest for ATS015 — Securing Workloads (Istio Certified Associate).
#
# Each module is a reading landing page (course.md), ordered deep-dive parts
# (course-0N-*.md), an ungraded playground, and a graded lab. Each section ends
# with a capstone lab combining its modules.
#
# Every `path:` is relative to this file.

training:
  id: ATS015
  title: Securing Workloads
  description: >
    Course material for the Securing Workloads domain of the Istio Certified
    Associate exam: workload identity, mutual TLS, authorization policy,
    end-user JWT authentication, edge TLS, and authorization in ambient mode.

  certification:
    name: Istio Certified Associate
    code: ICA
    provider: CNCF
    domain: Securing Workloads
    weight: 25

  environment:
    istio: "1.30.5"
    runtime: kind

sections:
  - id: section-010
    title: Workload Identity And Mutual TLS
    curriculum_item: Configuring Authentication (mTLS, JWT)
    description: >
      Where a workload's mesh identity comes from, how to make it
      mandatory with PeerAuthentication, and how to migrate a live
      namespace to STRICT mTLS without breaking its callers.
    readme: sections/section-010/README.md
    modules:
      - id: module-01
        title: Inspect Workload Identity And Certificates
        content:
          - type: reading
            title: "Module 1: Inspect Workload Identity And Certificates"
            path: sections/section-010/module-01/course.md
          - type: reading
            title: "Module 1.1: How a workload gets its identity"
            path: sections/section-010/module-01/course-01-how-identity-is-issued.md
          - type: reading
            title: "Module 1.2: Reading the certificate a proxy holds"
            path: sections/section-010/module-01/course-02-reading-the-certificate.md
          - type: reading
            title: "Module 1.3: From SAN to policy principal"
            path: sections/section-010/module-01/course-03-principals-rotation-trust-domain.md
          - type: playground
            title: "Module 1 playground"
            path: sections/section-010/module-01/playground
          - type: lab
            title: "Module 1 lab: Prove A Workload Identity And Authorize On It"
            path: sections/section-010/module-01/labs/lab-01
