# Course manifest for ATS015 - Securing Workloads (Istio Certified Associate).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them.
#
# Every `path:` is relative to this file.

training:
  id: ATS015
  title: "ICA: Securing Workloads"
  description: >
    Training material covering the Istio Certified Associate (ICA) Securing
    Workloads domain: workload identity, mutual TLS, authorization policy,
    end-user JWT authentication, TLS at the edge of the mesh (ingress and
    egress), and authorization in ambient mode. Each module pairs a layered
    reader with an ungraded hands-on playground that runs the Starfleet (the
    Istio docs' Bookinfo sample with space names) and graded practice labs.
    Each section closes with an integration capstone.
    Built and verified against Istio 1.30.5.

  certification:
    name: Istio Certified Associate
    code: ICA
    provider: CNCF / Linux Foundation
    domain: Securing Workloads
    weight: 25

modules:

  - id: module-intro
    title: "Mission Briefing"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Mission Briefing
        path: sections/intro/README.md
      - type: reading
        title: "Welcome, Astronaut"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Before Your First Launch"
        path: sections/intro/course-02-before-your-first-launch.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

