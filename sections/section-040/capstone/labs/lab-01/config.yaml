metadata:
  name: "ats-015-capstone-040"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane with its ingress gateway, plus openssl"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-040-setup"
      description: "Creates tls-demo (booking-service, notification-service and tls-backend, which terminates TLS itself) and leaves /tmp/booking.crt and /tmp/booking.key for the terminated hostname"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-section-040-capstone"
      description: "Confirms one Gateway edge-gateway with SIMPLE and PASSTHROUGH listeners, the booking-credential secret in istio-system, the right certificate served for each hostname with a 200, and a 301 redirect on port 80"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
