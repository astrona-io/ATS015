# CAP015-040, part 2 of 2 — one gateway, three listeners, two TLS modes.
#
# SNI selects between the two 443 listeners at connection time, which is why the
# modes are a per-listener choice rather than a per-gateway one.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: edge-gateway
  namespace: tls-demo
spec:
  selector:
    istio: ingressgateway
  servers:
    # Terminated: the gateway holds the certificate and sees the HTTP request.
    - port:
        number: 443
        name: https-booking
        protocol: HTTPS
      hosts:
        - booking.ica.local
      tls:
        mode: SIMPLE
        credentialName: booking-credential
    # Passthrough: protocol TLS, no credential, nothing decrypted.
    - port:
        number: 443
        name: tls-secure
        protocol: TLS
      hosts:
        - secure.ica.local
      tls:
        mode: PASSTHROUGH
    # Plaintext, redirect only.
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - booking.ica.local
      tls:
        httpsRedirect: true
---
# Terminated traffic routes with an http block.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: booking
  namespace: tls-demo
spec:
  hosts:
    - booking.ica.local
  gateways:
    - edge-gateway
  http:
    - match:
        - uri:
            prefix: /book
      route:
        - destination:
            host: booking-service
            port:
              number: 80
---
# Passthrough traffic routes with a tls block on sniHosts — an http block would
# apply cleanly and match nothing.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: passthrough
  namespace: tls-demo
spec:
  hosts:
    - secure.ica.local
  gateways:
    - edge-gateway
  tls:
    - match:
        - port: 443
          sniHosts:
            - secure.ica.local
      route:
        - destination:
            host: tls-backend
            port:
              number: 8443
