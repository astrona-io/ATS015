# TLS Passthrough Instead Of Termination (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, installs Istio, the ingress gateway, the Starfleet
# and tls-backend, then stays running for free exploration.
# No task, no grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-015-playground-040-03"
#   astrona destroy ats-015-playground-040-03 delete the cluster again
metadata:
  name: "ats-015-playground-040-03"
  docs:
    guide: "docs/overview.md"

# Port forwards: astrona keeps these running on 127.0.0.1 (astrona port-forward list).
runtime:
  type: kind
  portForwards:
    - name: ingress-http
      resource: svc/istio-ingress
      namespace: istio-ingress
      hostPort: 8080
      targetPort: 80
      scheme: http
      description: "Ingress gateway HTTP – send Host: starfleet.example.com, path /productpage"
    - name: ingress-https
      resource: svc/istio-ingress
      namespace: istio-ingress
      hostPort: 8443
      targetPort: 443
      scheme: https
      description: "Ingress gateway port 443 – answers once a TLS or HTTPS server exists for the SNI name you send"

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio 1.30.5 (istio-base, istiod, ingress gateway in istio-ingress) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace starfleet, access logs, the Starfleet (bridge, cargo, scout v1-v3, navcom), shuttle, tls-backend (its own certificate) and the bridge behind the gateway over HTTP"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
