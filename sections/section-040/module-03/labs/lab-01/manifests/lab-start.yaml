apiVersion: v1
kind: Namespace
metadata:
  name: passthrough-demo
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-backend-conf
  namespace: passthrough-demo
data:
  default.conf: |
    server {
      listen 8443 ssl;
      server_name secure.ica.local;
      ssl_certificate     /etc/nginx/certs/tls.crt;
      ssl_certificate_key /etc/nginx/certs/tls.key;
      location / { return 200 "backend terminated TLS\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-backend
  namespace: passthrough-demo
  labels:
    app: tls-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tls-backend
  template:
    metadata:
      labels:
        app: tls-backend
    spec:
      initContainers:
        # Generates a self-signed certificate so the lab needs no external files.
        - name: gen-cert
          image: alpine/openssl:latest
          command:
            - sh
            - -c
            - >
              openssl req -x509 -nodes -days 365 -newkey rsa:2048
              -keyout /certs/tls.key -out /certs/tls.crt
              -subj "/CN=secure.ica.local/O=backend"
          volumeMounts:
            - name: certs
              mountPath: /certs
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: certs
              mountPath: /etc/nginx/certs
      volumes:
        - name: conf
          configMap:
            name: tls-backend-conf
        - name: certs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tls-backend
  namespace: passthrough-demo
  labels:
    app: tls-backend
spec:
  ports:
    - name: tls
      port: 8443
      targetPort: 8443
  selector:
    app: tls-backend
