metadata:
  name: "ats-015-lab-040-03"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane including the ingress gateway"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-040-03-workloads"
      description: "Creates the passthrough-demo namespace with tls-backend, an nginx that makes its own certificate and ends TLS itself. No Gateway, no VirtualService, no TLS secret"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-passthrough"
      description: "Confirms the Gateway passthrough-gateway and the VirtualService passthrough exist, the listener is TLS PASSTHROUGH with no credential, the route matches sniHosts, a real request through the gateway gets 200, the certificate served is the backend's own, and the gateway has no HTTP route for the host"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
