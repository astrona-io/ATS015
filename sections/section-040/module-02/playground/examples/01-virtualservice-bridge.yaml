# Route requests arriving at starfleet-gateway to the bridge.
# TLS is handled by the Gateway, so this VirtualService looks the same for
# HTTP, SIMPLE TLS and MUTUAL TLS.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: bridge
  namespace: starfleet
spec:
  # Must match a host on the Gateway server.
  hosts:
  - starfleet.example.com
  # Bind to the Gateway. Without this, the rule only applies to sidecars.
  gateways:
  - starfleet-gateway
  http:
  # Only the paths the bridge serves; anything else gets 404 from the gateway.
  - match:
    - uri:
        exact: /productpage
    - uri:
        prefix: /static
    - uri:
        exact: /login
    - uri:
        exact: /logout
    - uri:
        prefix: /api/v1/products
    route:
    - destination:
        host: bridge
        port:
          number: 9080
