# NOT A SECRET. Throwaway self-signed material generated for this lab only,
# for the non-routable training hostnames *.ica.local. It secures nothing
# real and is committed deliberately so `astrona test` is reproducible.
# Reference end state for LAB015-040-02, part 1 of 2.
#
# MUTUAL needs three keys, not two: tls.crt / tls.key are what the gateway
# PRESENTS, and ca.crt is the validation context it CHECKS CLIENTS AGAINST.
# `kubectl create secret tls` cannot build this — it has no CA flag — so a
# learner uses `create secret generic` with explicit key names. The material
# here is the same fixed CA and server certificate the bootstrap writes to /tmp.
apiVersion: v1
kind: Secret
metadata:
  name: booking-credential-mtls
  namespace: istio-system
type: Opaque
data:
  tls.crt: 
  tls.key: 
  ca.crt: 
