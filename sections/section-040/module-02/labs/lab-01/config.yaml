metadata:
  name: "ats-015-lab-040-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 with istioctl and the demo profile (istiod and istio-ingressgateway in istio-system)"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-040-02-workloads"
      description: "Creates the mtlsedge-demo namespace with booking-service-v1, notification-service-v1 and a tester pod, and writes the lab's CA, server and client certificates to /tmp"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-mutual-gateway"
      description: "Confirms the secret carries tls.crt, tls.key and ca.crt, the Gateway has a MUTUAL server on 443 with that secret, the gateway listener requires a client certificate, a client with the CA's certificate gets 200 and a client without one is refused in the handshake"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
