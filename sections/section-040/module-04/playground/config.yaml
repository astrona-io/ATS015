# Originate TLS For External Services — Playground environment
# A clean sandbox: it spins up, installs Istio and the shuttle, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .                           new kind cluster "astro-ats-015-playground-040-04"
#   astrona destroy ats-015-playground-040-04   delete the cluster again
# Needs outbound internet access (httpbin.org on ports 80 and 443).
metadata:
  name: "ats-015-playground-040-04"
  docs:
    guide: "docs/overview.md"

runtime:
  type: kind

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio 1.30.5 (istio-base + istiod) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace starfleet (injected), mesh-wide access logs and the shuttle client"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
