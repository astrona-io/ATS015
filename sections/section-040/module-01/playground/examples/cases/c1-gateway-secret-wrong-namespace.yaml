# Case 1 (mistake): points at Secret "starfleet-credential-app-ns", which you
# create in namespace starfleet (where this Gateway resource lives) instead of
# istio-ingress (where the gateway POD runs). The gateway cannot load it.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: starfleet-gateway
  namespace: starfleet
spec:
  selector:
    istio: ingress
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - starfleet.example.com
    tls:
      mode: SIMPLE
      credentialName: starfleet-credential-app-ns
