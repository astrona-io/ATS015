metadata:
  name: "ats-015-lab-040-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane, which includes the istio-ingressgateway Deployment in istio-system"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-040-01-setup"
      description: "Creates the tls-demo namespace with booking-service, notification-service and a tester client, and leaves certificate material for booking.ica.local in /tmp. No TLS Secret, Gateway or VirtualService"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-https-at-the-edge"
      description: "Confirms the booking-credential Secret is in istio-system with tls.crt and tls.key, the Gateway and VirtualService exist in tls-demo, the gateway proxy holds the credential, HTTPS for booking.ica.local answers 200 with the supplied certificate, and plain HTTP on port 80 answers with a redirect"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
