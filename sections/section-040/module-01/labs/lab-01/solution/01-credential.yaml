# NOT A SECRET. Throwaway self-signed material generated for this lab only,
# for the non-routable training hostnames *.ica.local. It secures nothing
# real and is committed deliberately so `astrona test` is reproducible.
# Reference end state for LAB015-040-01, part 1 of 2.
#
# The credential MUST live in the gateway pod's namespace (istio-system), not in
# the namespace the Gateway object lives in. A learner would build this with
# `kubectl -n istio-system create secret tls booking-credential --cert=... --key=...`
# from the material the bootstrap leaves in /tmp; the certificate embedded here is
# an equivalent self-signed cert for CN=booking.ica.local, so CI is deterministic.
apiVersion: v1
kind: Secret
metadata:
  name: booking-credential
  namespace: istio-system
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
