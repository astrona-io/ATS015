metadata:
  name: "ats-015-capstone-050"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane, with the ingress gateway set to trust one proxy hop (numTrustedProxies 1)"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-050-setup"
      description: "Creates gwauthz-demo (booking-service with no /admin handler, notification-service, tester) and a Gateway and VirtualService exposing booking.ica.local on port 80"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-section-050-capstone"
      description: "Confirms gateway-scoped policies in istio-system that match on remoteIpBlocks, and the five graded calls through the gateway with forged X-Forwarded-For addresses"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
