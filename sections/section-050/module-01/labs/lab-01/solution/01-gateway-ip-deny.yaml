# remoteIpBlocks matches the originating client from X-Forwarded-For.
# Requires meshConfig.gatewayTopology.numTrustedProxies to be trustworthy.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-ip-deny
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: DENY
  rules:
    - from:
        - source:
            remoteIpBlocks:
              - 192.168.0.0/16
