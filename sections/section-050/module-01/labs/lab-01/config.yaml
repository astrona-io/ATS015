metadata:
  name: "ats-015-lab-050-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 with istioctl (demo profile) and gives the ingress gateway one trusted proxy hop (numTrustedProxies: 1, as a proxy.istio.io/config annotation)"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-050-01-workloads"
      description: "Creates namespace gwauthz-demo with booking-service-v1, notification-service-v1, a tester pod, and a Gateway plus VirtualService for booking.ica.local. No AuthorizationPolicy"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-gateway-ip-deny"
      description: "Confirms an AuthorizationPolicy in istio-system selects the ingress gateway and uses remoteIpBlocks, the gateway still trusts one proxy hop, and live signals through the gateway get 200 for X-Forwarded-For 10.1.2.3 and 403 for 192.168.5.5"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
