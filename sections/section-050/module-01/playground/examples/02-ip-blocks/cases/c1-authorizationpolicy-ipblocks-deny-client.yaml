# MISTAKE: ipBlocks used to block a client that sits behind a proxy.
# ipBlocks reads the connection peer (the proxy), never X-Forwarded-For,
# so a request with X-Forwarded-For: 192.168.5.5 is still served.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-ip-deny
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: ingress
  action: DENY
  rules:
  - from:
    - source:
        ipBlocks: ["192.168.0.0/16"]
