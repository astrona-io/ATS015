# Block a client range at the ingress gateway, by the ORIGINAL client address.
# remoteIpBlocks reads the address the gateway took from X-Forwarded-For,
# which needs numTrustedProxies to match the proxies in front of the gateway.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-ip-deny
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: ingress
  action: DENY
  rules:
  - from:
    - source:
        remoteIpBlocks: ["192.168.0.0/16"]
