# MISTAKE: a block-list written as ALLOW + notRemoteIpBlocks with no other
# ALLOW on the gateway. It works for this host, but it is now the only ALLOW
# policy on a shared gateway: change it later (add a path, a host) and every
# request that matches no ALLOW rule is denied, on every host. DENY is the
# safer shape for a block-list.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-ip-allow-all-but
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: ingress
  action: ALLOW
  rules:
  - from:
    - source:
        notRemoteIpBlocks: ["192.168.0.0/16"]
