# Only the office network (203.0.113.0/24) may reach the bridge's API.
# Read it as: DENY a signal to /api/v1/products* when its client address
# is NOT in the office range. Everything else on the gate stays open.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-api-office-only
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: ingress
  action: DENY
  rules:
  - to:
    - operation:
        hosts: ["starfleet.example.com"]
        paths: ["/api/v1/products*"]
    from:
    - source:
        notRemoteIpBlocks: ["203.0.113.0/24"]
