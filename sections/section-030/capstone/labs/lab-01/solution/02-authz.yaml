# CAP015-030, part 2 of 2 — one policy, one rule per role.
#
# Both rules carry requestPrincipals: ["*"], which is what makes a valid token
# mandatory. A `when` block alone is only a condition: a request with no token
# has no attributes, so the condition fails — but a rule without
# requestPrincipals could still be satisfied by some other means.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: notification-access
  namespace: jwtclaims-demo
spec:
  selector:
    matchLabels:
      app: notification-service
  action: ALLOW
  rules:
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            methods: ["POST"]
            paths: ["/notify"]
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/admin"]
      when:
        - key: request.auth.claims[groups]
          values: ["group1"]
