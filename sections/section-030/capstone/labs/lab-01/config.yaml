metadata:
  name: "ats-015-capstone-030"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-030-setup"
      description: "Creates jwtclaims-demo (booking-service, notification-service with no /admin handler, tester), with no RequestAuthentication or AuthorizationPolicy"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-section-030-capstone"
      description: "Confirms a RequestAuthentication for testing@secure.istio.io, a policy using requestPrincipals and a groups claim, the six graded token calls (403, 401, 200, 403, allowed, 403), and booking-service still open without a token"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
