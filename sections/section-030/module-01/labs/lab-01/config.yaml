# Require A Valid End-User Token (ats-015-lab-030-01)
# Astrona hands-on lab. kind runtime: a single-node cluster with Istio 1.30.5.
# Needs outbound internet: the grader and istiod fetch the Istio demo token and
# its JWKS from raw.githubusercontent.com.
metadata:
  name: "ats-015-lab-030-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-030-01-workloads"
      description: "Creates the jwt-demo namespace with booking-service-v1, notification-service-v1 and the tester client. Creates nothing the task asks for"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-require-jwt"
      description: "Confirms a RequestAuthentication for the demo issuer and an AuthorizationPolicy with requestPrincipals exist in jwt-demo, then sends real requests: no token gets 403, a bad token 401, the demo token 200, and booking-service still answers without a token"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
