# Reference end state for LAB015-030-01, part 2 of 2.
# requestPrincipals is what actually makes a token mandatory: this ALLOW policy
# creates default-deny for the workload, and only a validated token produces a
# request principal to match.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: require-jwt
  namespace: jwt-demo
spec:
  selector:
    matchLabels:
      app: notification-service
  action: ALLOW
  rules:
    - from:
        - source:
            requestPrincipals: ["*"]
