# Authenticate End Users With JWT — Playground environment
# A clean sandbox: it spins up, installs Istio and the Starfleet, then stays running
# for free exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-015-playground-030-01"
#   astrona destroy ats-015-playground-030-01  delete the cluster again
# istiod needs outbound internet: it downloads the sample signing keys (JWKS)
# from raw.githubusercontent.com.
metadata:
  name: "ats-015-playground-030-01"
  docs:
    guide: "docs/overview.md"

runtime:
  type: kind

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio 1.30.5 (istio-base + istiod) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace starfleet, access logs, the Starfleet (bridge, cargo, scout v1-v3, navcom), shuttle and probe v1/v2"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
