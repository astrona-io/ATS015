# Check end-user tokens (JWTs) on signals to the probe.
# Uses Istio's sample issuer and keys, so the sample tokens from the Istio
# repository work.
# A signal WITH a token: the token must be valid, otherwise HTTP 401.
# A signal WITHOUT a token: still allowed! RequestAuthentication only checks
# tokens that are present. To require one, add an AuthorizationPolicy (02).
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: probe-jwt
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: probe
  jwtRules:
  # Expected "iss" claim in the token.
  - issuer: testing@secure.istio.io
    # Public keys used to check the token signature. istiod fetches them.
    jwksUri: https://raw.githubusercontent.com/istio/istio/release-1.30/security/tools/jwt/samples/jwks.json
    # Token location: default is "Authorization: Bearer <token>".
    # Keep the token in the request sent on to the probe (default: removed).
    forwardOriginalToken: true
