# Case 2: the same "token required" rule written as DENY:
# deny every request that does NOT have a valid request principal.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: probe-require-jwt
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: probe
  action: DENY
  rules:
  - from:
    - source:
        notRequestPrincipals: ["*"]
