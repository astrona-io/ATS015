# Precondition for this module: the probe's communications officer (sidecar)
# checks end-user tokens (JWTs) from Istio's sample issuer.
# A request WITH a token: the token must be valid, otherwise HTTP 401.
# A request WITHOUT a token: still allowed. RequestAuthentication only checks
# tokens that are present. The module adds AuthorizationPolicies that read the
# token's claims.
# istiod downloads the public keys from jwksUri, so the cluster needs internet.
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: probe-jwt
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: probe
  jwtRules:
  # Expected "iss" claim in the token.
  - issuer: testing@secure.istio.io
    # Public keys used to check the token signature.
    jwksUri: https://raw.githubusercontent.com/istio/istio/release-1.30/security/tools/jwt/samples/jwks.json
    # Keep the token in the request sent on to the probe (default: removed),
    # so /headers shows the Authorization header that arrived.
    forwardOriginalToken: true
