# Authorize On JWT Claims — Playground environment
# A clean sandbox: it spins up, installs Istio and the Starfleet, then stays running
# for free exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-015-playground-030-02"
#   astrona destroy ats-015-playground-030-02  delete the cluster again
# Needs outbound internet: istiod fetches the sample issuer's keys from GitHub.
metadata:
  name: "ats-015-playground-030-02"
  docs:
    guide: "docs/overview.md"

runtime:
  type: kind

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio 1.30.5 (istio-base + istiod) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace starfleet, access logs, the Starfleet, shuttle, probe v1/v2, and a RequestAuthentication on the probe (precondition)"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
