metadata:
  name: "ats-015-lab-030-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-030-02-workloads"
      description: "Creates namespace jwtclaims-demo with booking-service, notification-service and the tester client, plus the RequestAuthentication for the demo issuer (a precondition). Creates nothing the task asks for"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-claim-authorization"
      description: "Confirms an AuthorizationPolicy matches on request.auth.claims, the RequestAuthentication is unchanged, and live signals from tester give 403 without a token, 200 for POST /notify with any token, 403 on /admin without group1 and not 403 on /admin with group1"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
