# The starting state of the lab: the probe's access model with two faults.
# (Do not copy this into course pages: it is deliberately wrong.)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: probe-access
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: probe
  action: ALLOW
  rules:
  - from:
    - source:
        requestPrincipals: ["*"]
    to:
    - operation:
        paths: ["/headers"]
  - from:
    - source:
        requestPrincipals: ["*"]
    to:
    - operation:
        methods: ["GET"]
        paths: ["/get"]
  - from:
    - source:
        requestPrincipals: ["*"]
    to:
    - operation:
        paths: ["/anything/admin"]
    when:
    - key: request.auth.claims[group]
      values: ["group1"]
