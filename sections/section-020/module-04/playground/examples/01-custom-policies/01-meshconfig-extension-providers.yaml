# The extensionProviders block that goes into the `mesh` key of the `istio`
# ConfigMap in istio-system.
extensionProviders:
- name: sample-ext-authz-grpc
  envoyExtAuthzGrpc:
    service: ext-authz.starfleet.svc.cluster.local
    port: "9000"
- name: sample-ext-authz-http
  envoyExtAuthzHttp:
    service: ext-authz.starfleet.svc.cluster.local
    port: "8000"
    includeRequestHeadersInCheck: ["x-ext-authz"]
