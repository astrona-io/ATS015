# The precondition for this lab: STRICT mTLS in the namespace starfleet.
# Every pod must use mTLS before it may connect. So every caller that gets
# in has a verified certificate, and `principals` rules in an
# AuthorizationPolicy have a real identity to compare. Do not change or remove it.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: starfleet
spec:
  mtls:
    mode: STRICT
