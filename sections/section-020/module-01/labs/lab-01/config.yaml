# Lock A Namespace Down With ALLOW Policies (ats-015-lab-020-01)
# Astrona hands-on lab, graded. kind runtime: a single-node cluster with
# Istio 1.30.5 (demo profile). The lab keeps its own small app
# (booking-service, notification-service, tester) in namespace authz-demo.
metadata:
  name: "ats-015-lab-020-01"
  docs:
    question: "question.md"
    solution: "solution.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 with the demo profile and a pinned istioctl"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-020-01-workloads"
      description: "Creates namespace authz-demo with booking-service (booking-sa), notification-service and the tester client, plus a STRICT PeerAuthentication. No AuthorizationPolicy."
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-behaviour"
      description: "Confirms an AuthorizationPolicy exists in authz-demo, sends the five graded calls (tester and booking-service to /book and /notify) and asserts each status code, and checks that the notification rule matches on principals without the spiffe:// scheme"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
