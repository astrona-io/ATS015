# The precondition for this lab: STRICT mTLS in authz-demo. Every caller must
# use mTLS, so `principals` rules have a verified identity to
# compare. Do not change or remove it.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: authz-demo
spec:
  mtls:
    mode: STRICT
