# The precondition for this playground: STRICT mTLS in the namespace starfleet.
# Every pod must use mTLS before it may connect. So every caller that gets
# in has a verified certificate, and `principals` and
# `namespaces` rules in an AuthorizationPolicy have a real identity to compare.
# The drifter in the outpost namespace has no sidecar and no certificate, so
# its plain-text requests are cut off here, before any AuthorizationPolicy runs.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: starfleet
spec:
  mtls:
    mode: STRICT
