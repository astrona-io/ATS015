# Fortio: the load generator; it sends many requests at once.
# In this course it is mostly a second caller with another identity. It has no
# service account of its own, so it runs as "default" and its identity is
# spiffe://cluster.local/ns/starfleet/sa/default. One test request:
#   kubectl exec -n starfleet deploy/fortio -c fortio -- \
#     fortio curl -quiet http://probe:8000/get
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      containers:
      - name: fortio
        image: fortio/fortio:1.69.5
        # Runs fortio's web server so the container stays up; we exec into it.
        args: ["server"]
