# CAP015-020, part 5 of 5 — the careless future rule, written today as proof.
# It explicitly permits what the DENY blocks, and changes nothing.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-admin-attempt
  namespace: authz-demo
spec:
  selector:
    matchLabels:
      app: notification-service
  action: ALLOW
  rules:
    - to:
        - operation:
            paths: ["/admin*"]
