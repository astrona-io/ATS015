metadata:
  name: "ats-015-capstone-020"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-020-setup"
      description: "Creates authz-demo (booking-service as booking-sa, notification-service with no /admin handler, tester) under a namespace STRICT PeerAuthentication, with no AuthorizationPolicy"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-section-020-capstone"
      description: "Confirms a DENY backstop and a principals rule exist, the permissive /admin ALLOW policy is still in place, and the six graded calls return 200 or 403 as specified"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
