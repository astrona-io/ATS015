# Starting state for ats-015-lab-020-03: namespace starfleet (sidecar injection),
# shuttle and relay (two TCP clients with different identities), tcp-echo (a TCP
# server on ports 9000, 9001 and 9002) and a STRICT PeerAuthentication.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shuttle
  namespace: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      serviceAccountName: shuttle
      # Stop instantly on delete; nothing to drain in a test client.
      terminationGracePeriodSeconds: 0
      containers:
      - name: shuttle
        image: curlimages/curl:8.11.1
        # Keep the container running so we can exec into it.
        command: ["sleep", "infinity"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay
  namespace: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      serviceAccountName: relay
      terminationGracePeriodSeconds: 0
      containers:
      - name: relay
        image: curlimages/curl:8.11.1
        command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Service
metadata:
  name: tcp-echo
  namespace: starfleet
  labels:
    app: tcp-echo
    service: tcp-echo
spec:
  ports:
  - name: tcp
    port: 9000
  - name: tcp-other
    port: 9001
  selector:
    app: tcp-echo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-echo
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tcp-echo
      version: v1
  template:
    metadata:
      labels:
        app: tcp-echo
        version: v1
    spec:
      terminationGracePeriodSeconds: 0
      containers:
      - name: tcp-echo
        image: registry.istio.io/release/tcp-echo-server:1.3
        imagePullPolicy: IfNotPresent
        args: ["9000,9001,9002", "hello"]
        ports:
        - containerPort: 9000
        - containerPort: 9001
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: starfleet
spec:
  mtls:
    mode: STRICT
