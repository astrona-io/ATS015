# Allow Only One Caller To One TCP Port (ats-015-lab-020-03)
# Astrona hands-on lab. kind runtime (default): a single-node cluster with Istio 1.30.5.
# STATUS: UNTESTED. Built from the Istio documentation; never run on a cluster.
metadata:
  name: "ats-015-lab-020-03"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 with istioctl (demo profile)"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-020-03-workloads"
      description: "Creates namespace starfleet with shuttle, relay, tcp-echo (TCP ports 9000-9002) and a STRICT PeerAuthentication. Creates no AuthorizationPolicy."
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-tcp-authorization"
      description: "Checks an ALLOW policy with principals and a ports-only DENY exist, then opens real TCP connections: shuttle reaches 9000, is refused on 9001 and on 9002 by pod IP, and relay is refused on 9000"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
