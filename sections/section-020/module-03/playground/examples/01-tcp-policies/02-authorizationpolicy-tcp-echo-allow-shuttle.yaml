apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: tcp-allow-shuttle
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: tcp-echo
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/starfleet/sa/shuttle"]
    to:
    - operation:
        ports: ["9000"]
