# DENY Policies And Evaluation Order — Playground environment
# A clean sandbox: it spins up, installs Istio and the Starfleet, then stays running
# for free exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-015-playground-020-02"
#   astrona destroy ats-015-playground-020-02  delete the cluster again
metadata:
  name: "ats-015-playground-020-02"
  docs:
    guide: "docs/overview.md"

runtime:
  type: kind

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio 1.30.5 (istio-base + istiod) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace starfleet with access logs, the Starfleet (bridge, cargo, scout v1-v3, navcom), shuttle, probe v1/v2, fortio, the drifter in the outpost namespace (no sidecar), and STRICT mTLS for starfleet"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
