# The precondition for this module: STRICT mTLS in the namespace starfleet.
# Every caller must use mTLS and present its certificate before a connection
# is accepted. That makes each caller's identity (its principal) trustworthy, so
# an AuthorizationPolicy can use it. The drifter in outpost has no certificate
# and no sidecar, so starfleet pods refuse its plain-text requests.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: starfleet
spec:
  mtls:
    mode: STRICT
