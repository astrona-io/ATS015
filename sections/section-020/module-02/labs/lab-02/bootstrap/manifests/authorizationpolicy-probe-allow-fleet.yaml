# The starting ALLOW policy for the probe: every workload in the namespace
# starfleet may send any request (any method, any path). It is part of the lab's starting
# state and must stay unchanged. The task adds a DENY next to it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: probe-allow-fleet
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: probe
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces: ["starfleet"]
