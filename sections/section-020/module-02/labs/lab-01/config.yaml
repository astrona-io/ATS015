# Close A Path With DENY (ats-015-lab-020-02)
# Astrona hands-on lab. kind runtime (default): a single-node cluster with Istio 1.30.5.
metadata:
  name: "ats-015-lab-020-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 with istioctl (demo profile)"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-020-02-workloads"
      description: "Creates namespace deny-demo with booking-service-v1, notification-service-v1, the tester client and a STRICT PeerAuthentication. Creates no AuthorizationPolicy."
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-deny-beats-allow"
      description: "Confirms a DENY policy and an ALLOW naming /admin exist in deny-demo, then sends real traffic from tester: POST /notify gets 200, GET /admin and GET /admin/users get 403"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
