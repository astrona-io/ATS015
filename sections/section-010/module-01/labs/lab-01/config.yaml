metadata:
  name: "ats-015-lab-010-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-010-01-workloads"
      description: "Creates the identity-demo namespace with booking-service (service account booking-sa), notification-service and a tester client, and no security policy"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-identity-authorization"
      description: "Confirms a namespace-wide STRICT PeerAuthentication and an AuthorizationPolicy on principals without spiffe://, then sends live traffic: booking-service gets 200 and tester gets 403"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
