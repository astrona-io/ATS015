# Reference end state for LAB015-010-01.
#
# STRICT mTLS first: without it there is no verified peer identity for the
# AuthorizationPolicy below to match on.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: identity-demo
spec:
  mtls:
    mode: STRICT
---
# The principal is the certificate SAN with the `spiffe://` scheme removed.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: notification-by-identity
  namespace: identity-demo
spec:
  selector:
    matchLabels:
      app: notification-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/identity-demo/sa/booking-sa
