# CAP015-010, part 4 of 4 — identity-based authorization. The principal is the
# certificate SAN without the spiffe:// scheme. `namespaces` would not do: tester
# runs in the same namespace.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: notification-by-identity
  namespace: identity-demo
spec:
  selector:
    matchLabels:
      app: notification-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/identity-demo/sa/booking-sa
