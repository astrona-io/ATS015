metadata:
  name: "ats-015-capstone-010"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane, plus openssl"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-010-setup"
      description: "Creates identity-demo (booking-service as booking-sa, notification-service, tester, all with sidecars) and outside (outside-client with no sidecar), with no PeerAuthentication or AuthorizationPolicy"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-section-010-capstone"
      description: "Confirms a selector-less STRICT PeerAuthentication named default in istio-system, a sidecar on outside-client that still reaches booking-service, and a principals-based policy that lets booking-sa reach notification-service while tester gets 403"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
