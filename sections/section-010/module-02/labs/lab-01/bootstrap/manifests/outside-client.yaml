apiVersion: v1
kind: Namespace
metadata:
  name: outside
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outside-client
  namespace: outside
  labels:
    app: outside-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outside-client
  template:
    metadata:
      labels:
        app: outside-client
    spec:
      containers:
        - name: outside-client
          image: curlimages/curl
          command: ["sh", "-c", "while true; do sleep 30; done"]
