metadata:
  name: "ats-015-lab-010-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-010-02-workloads"
      description: "Creates mtls-demo (injected: booking-service, notification-service, tester) and outside (not injected: outside-client). Creates nothing the task asks for"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-three-scopes"
      description: "Confirms peerauthentication/default exists in istio-system (STRICT) and in mtls-demo (PERMISSIVE), a workload STRICT policy selects notification-service, outside-client is refused by notification-service but reaches booking-service, and tester still reaches notification-service"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
