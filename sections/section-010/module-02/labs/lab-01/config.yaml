# Enforce mTLS At Three Scopes (LAB015-010-02)
# Astrona hands-on lab. Schema: internal/config.LabConfig.
# kind runtime (default): a single-node cluster with Istio 1.30.5.

metadata:
  name: "ats-015-lab-010-02"
  docs:
    prerequisites: "docs/prerequisites.md"
    examQuestion: "docs/exam-question.md"
    caseStudy: "docs/case-study.md"
    guide: "docs/step-by-step-guide.md"

bootstrap:
  init:
    - name: "setup"
      description: "Installs Istio (demo profile) and the starting workloads. Creates nothing the task asks for."
      type: "file"
      source: "bootstrap/setup.sh"
  manifests:
    - name: "lab-start"
      description: "Starting workloads: namespace, service accounts, Deployments, Services and a client pod."
      type: "file"
      source: "manifests/lab-start.yaml"
    - name: "outside-client"
      description: "A client pod outside the mesh, so plaintext traffic has a source."
      type: "file"
      source: "manifests/outside-client.yaml"

testing:
  manifests:
    - name: "solution"
      description: "Reference end state applied by `astrona test` in CI."
      type: "folder"
      source: "solution"

validation:
  checks:
    - name: "mesh-wide PeerAuthentication in istio-system"
      type: "resourceExists"
      resource: "peerauthentication/default -n istio-system"
    - name: "namespace PeerAuthentication in mtls-demo"
      type: "resourceExists"
      resource: "peerauthentication/default -n mtls-demo"
  script:
    name: "verify-behaviour"
    description: "Sends real traffic and asserts the outcomes the task specifies."
    type: "file"
    source: "validate.sh"

teardown:
  init:
    - name: "dump-logs"
      description: "Best-effort state capture before teardown."
      type: "file"
      source: "teardown/dump-logs.sh"
  keepCluster: false
