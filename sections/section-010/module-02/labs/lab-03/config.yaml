metadata:
  name: "ats-015-lab-010-02-03"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs Istio 1.30.5 (istio-base and istiod) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-010-02-03-workloads"
      description: "Creates the starfleet namespace with the Starfleet, shuttle, probe v1/v2 and access logs, and the outpost namespace with the drifter (no sidecar)"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"
    - name: "lab-010-02-03-fault"
      description: "Applies the starting state: a namespace-wide STRICT PeerAuthentication in starfleet, and a probe DestinationRule with LEAST_REQUEST load balancing and tls.mode DISABLE"
      type: "file"
      source: "bootstrap/03-seed-fault.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-handshake"
      description: "Confirms starfleet is still STRICT with no exception, the probe DestinationRule keeps LEAST_REQUEST and no longer disables TLS, the shuttle reaches the probe with its identity in X-Forwarded-Client-Cert, and the drifter is still refused"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
