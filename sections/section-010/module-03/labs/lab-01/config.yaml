metadata:
  name: "ats-015-lab-010-03"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5 and a demo-profile control plane"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-010-03-workloads"
      description: "Creates migrate-demo (injected) with booking-service, notification-service and a tester client, and outside (not injected) with outside-client. No PeerAuthentication"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-strict-migration"
      description: "Confirms migrate-demo has a selector-less PeerAuthentication named default in STRICT mode, outside-client runs with an istio-proxy sidecar, both tester and outside-client still get 200 from notification-service, and the receiving listener on port 8084 requires a client certificate"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
