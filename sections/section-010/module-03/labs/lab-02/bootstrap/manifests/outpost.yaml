# The outpost: a planet WITHOUT sidecar injection, on purpose.
# The drifter is an old ship with no communications officer on board (1/1).
# In this lab the drifter must stay outside the fleet: it can never do the
# mTLS handshake, so it needs a port exception on the probe.
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drifter
  namespace: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drifter
  template:
    metadata:
      labels:
        app: drifter
    spec:
      terminationGracePeriodSeconds: 0
      containers:
      - name: drifter
        image: curlimages/curl:8.11.1
        command: ["sleep", "infinity"]
