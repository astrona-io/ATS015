# The outpost: a namespace WITHOUT sidecar injection, on purpose.
# The drifter is a client pod with no sidecar proxy (1/1).
# In this module the drifter is the client that still sends plain-text requests:
# it would break the moment starfleet switches to STRICT mTLS. Adding it
# to the mesh (label the namespace, then restart it) is part of the module.
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drifter
  namespace: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drifter
  template:
    metadata:
      labels:
        app: drifter
    spec:
      terminationGracePeriodSeconds: 0
      containers:
      - name: drifter
        image: curlimages/curl:8.11.1
        command: ["sleep", "infinity"]
