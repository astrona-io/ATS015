# Case 1: the same exception, keyed by the Service port (8000).
# No proxy listens on 8000 inside the pod, so the exception attaches to
# nothing. The object is accepted with no error, and the probe is STRICT on
# every port: the drifter gets a connection reset.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: probe
  mtls:
    mode: STRICT
  portLevelMtls:
    8000:
      mode: PERMISSIVE
