# The last step: every workload in starfleet accepts mTLS only.
# Apply it only after no client sends plain text any more (the drifter in
# outpost must have a sidecar first). A plain-text client gets a connection reset.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: starfleet
spec:
  mtls:
    mode: STRICT
