# Step 1 of the migration: write down the mode the planet is already in.
# PERMISSIVE accepts both mTLS and plain signals, so this changes nothing.
# It makes the choice visible, and it is the file you apply to roll back.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: starfleet
spec:
  mtls:
    mode: PERMISSIVE
