# Migrate A Namespace From PERMISSIVE To STRICT mTLS — Playground environment
# A clean sandbox: it spins up, installs Istio and the Starfleet, then stays running
# for free exploration. No task, no grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-015-playground-010-03"
#   astrona destroy ats-015-playground-010-03  delete the cluster again
metadata:
  name: "ats-015-playground-010-03"
  docs:
    guide: "docs/overview.md"

runtime:
  type: kind

bootstrap:
  init:
    - name: "install-istio"
      description: "Istio 1.30.5 (istio-base + istiod) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace starfleet with access logs, the Starfleet, shuttle and probe v1/v2, and namespace outpost WITHOUT injection with the drifter. No PeerAuthentication: starfleet starts in PERMISSIVE"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
