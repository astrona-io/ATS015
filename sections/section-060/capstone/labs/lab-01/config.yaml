metadata:
  name: "ats-015-capstone-060"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs istioctl 1.30.5, the Gateway API CRDs and an ambient-profile control plane (istiod and ztunnel, no sidecars)"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "capstone-060-setup"
      description: "Creates ambient-authz (notification-service, tester as tester-sa, other-client as other-sa) and enrols it in ambient mode, with no waypoint and no AuthorizationPolicy"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-section-060-capstone"
      description: "Confirms a waypoint exists and is enrolled, the policy attaches with targetRefs and no selector, the waypoint holds the authorization filter, and the four graded calls return 403, 200, 403 and 403"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
