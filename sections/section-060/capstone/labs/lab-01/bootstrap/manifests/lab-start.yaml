apiVersion: v1
kind: Namespace
metadata:
  name: ambient-authz
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tester-sa
  namespace: ambient-authz
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: other-sa
  namespace: ambient-authz
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-v1
  namespace: ambient-authz
  labels:
    app: notification-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
      version: v1
  template:
    metadata:
      labels:
        app: notification-service
        version: v1
    spec:
      containers:
        - name: notification-service
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8084
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: notification-service-v1-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ambient-authz
  labels:
    app: notification-service
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8084
  selector:
    app: notification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tester
  namespace: ambient-authz
  labels:
    app: tester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tester
  template:
    metadata:
      labels:
        app: tester
    spec:
      serviceAccountName: tester-sa
      containers:
        - name: tester
          image: curlimages/curl
          command: ["sh", "-c", "while true; do sleep 30; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: other-client
  namespace: ambient-authz
  labels:
    app: other-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: other-client
  template:
    metadata:
      labels:
        app: other-client
    spec:
      serviceAccountName: other-sa
      containers:
        - name: other-client
          image: curlimages/curl
          command: ["sh", "-c", "while true; do sleep 30; done"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-v1-nginx-conf
  namespace: ambient-authz
data:
  default.conf: |
    server {
      listen 8084;
      location / {
        default_type application/json;
        return 200 '{"service":"notification-service","version":"v1"}';
      }
    }
