# CAP015-060, part 1 of 4 — the connection-level half.
# Identity only, so ztunnel enforces it with no waypoint in the path. A label
# selector is the correct attachment for L4 policy on workloads.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: notification-l4
  namespace: ambient-authz
spec:
  selector:
    matchLabels:
      app: notification-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/ambient-authz/sa/tester-sa
