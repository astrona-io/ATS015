# CAP015-060, part 4 of 4 — the request-level half.
# `methods` and `paths` need the parsed request, so this is held by the waypoint.
# It attaches with targetRefs, naming the Service whose waypoint should hold it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: notification-l7
  namespace: ambient-authz
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: notification-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/ambient-authz/sa/tester-sa
      to:
        - operation:
            methods: ["POST"]
            paths: ["/notify"]
