metadata:
  name: "ats-015-lab-060-01-02"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs the Gateway API CRDs and Istio 1.30.5 in ambient mode (istio-base, istiod, istio-cni, ztunnel) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-060-01-02-workloads"
      description: "Creates the starfleet namespace enrolled in ambient mode, with the Starfleet (bridge, cargo, scout v1-v3, navcom) and the shuttle client. No AuthorizationPolicy and no waypoint"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-l4-identity-rules"
      description: "Confirms cargo-l4 and navcom-l4 are selector-based ALLOW policies with L4 fields only, no waypoint exists, the shuttle's connections to cargo and navcom are closed (000), the bridge still reaches cargo, the scouts still get ratings from navcom, and the shuttle still reaches scout"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
