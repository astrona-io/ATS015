# Reference end state for LAB015-060-01, part 3 of 4.
#
# A waypoint that exists is not a waypoint that receives traffic. Enrolment is a
# second, separate step — `istioctl waypoint apply --enroll-namespace` sets
# istio.io/use-waypoint. The dataplane-mode label is repeated here because
# `kubectl apply` would otherwise drop it.
apiVersion: v1
kind: Namespace
metadata:
  name: ambient-authz
  labels:
    istio.io/dataplane-mode: ambient
    istio.io/use-waypoint: waypoint
