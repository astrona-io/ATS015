# Reference end state for LAB015-060-01, part 1 of 4.
# Identity only, so ztunnel can enforce it with no waypoint in the path. A label
# selector is the right attachment for L4 policy on workloads.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: notification-l4
  namespace: ambient-authz
spec:
  selector:
    matchLabels:
      app: notification-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/ambient-authz/sa/tester-sa
