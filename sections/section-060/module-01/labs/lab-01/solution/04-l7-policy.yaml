# Reference end state for LAB015-060-01, part 4 of 4.
#
# `methods` needs the parsed request, so this is enforced by the waypoint, not by
# ztunnel. L7 policy attaches with targetRefs — naming the Service whose waypoint
# should hold it — rather than with a pod selector.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: notification-l7
  namespace: ambient-authz
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: notification-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/ambient-authz/sa/tester-sa
      to:
        - operation:
            methods: ["POST"]
