metadata:
  name: "ats-015-lab-060-01"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-istio"
      description: "Installs the Gateway API CRDs and Istio 1.30.5 in ambient mode (istio-base, istiod, istio-cni, ztunnel) with Helm"
      type: "file"
      source: "bootstrap/01-install-istio.sh"
    - name: "lab-060-01-workloads"
      description: "Creates namespace ambient-authz enrolled in ambient mode and mesh-wide access logs, with notification-service-v1, tester (tester-sa) and other-client (other-sa). No waypoint and no AuthorizationPolicy"
      type: "file"
      source: "bootstrap/02-seed-workloads.sh"

testing:
  init:
    - name: "solution"
      description: "Reference solution applied by `astrona test` in CI"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "verify-waypoint-policy"
      description: "Confirms a programmed waypoint Gateway exists, traffic is enrolled through it with istio.io/use-waypoint, an AuthorizationPolicy uses targetRefs, and live calls give other-client POST 403, tester POST 200 and tester GET 403"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
