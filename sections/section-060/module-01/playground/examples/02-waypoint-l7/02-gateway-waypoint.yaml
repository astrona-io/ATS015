# The waypoint as YAML: this is what "istioctl waypoint apply -n starfleet"
# creates. Istio builds the waypoint Deployment and Service from it.
# It receives no traffic until a namespace or Service carries the label
# istio.io/use-waypoint=waypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: starfleet
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
