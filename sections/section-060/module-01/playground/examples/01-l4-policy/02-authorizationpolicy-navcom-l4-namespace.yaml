# L4 rule on a namespace: every workload in namespace starfleet may connect to
# navcom. "namespaces" comes from the caller's identity, so ztunnel enforces it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: navcom-l4
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: navcom
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces:
        - starfleet
