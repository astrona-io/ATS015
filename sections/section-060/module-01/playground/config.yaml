# Authorization In Ambient Mode, L4 And L7 — Playground environment
# A clean sandbox: it spins up, installs the Gateway API CRDs, Istio in ambient
# mode and the Starfleet, then stays running for free exploration. No task, no
# grading, no `astrona submit`.
#   astrona run -c .                          new kind cluster "astro-ats-015-playground-060-01"
#   astrona destroy ats-015-playground-060-01  delete the cluster again
metadata:
  name: "ats-015-playground-060-01"
  docs:
    guide: "docs/overview.md"

runtime:
  type: kind

bootstrap:
  init:
    - name: "install-istio"
      description: "Gateway API CRDs, then Istio 1.30.5 in ambient mode (istio-base, istiod, istio-cni, ztunnel) with Helm"
      type: "file"
      source: "bootstrap/install-istio.sh"
    - name: "deploy"
      description: "Namespace starfleet enrolled in ambient mode, access logs, the Starfleet (bridge, cargo, scout v1-v3, navcom), shuttle and probe v1/v2"
      type: "file"
      source: "bootstrap/deploy.sh"

teardown:
  keepCluster: false
